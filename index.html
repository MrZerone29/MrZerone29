  <!-- Đặt vietqr.js cùng thư mục với trang HTML hoặc sửa đường dẫn bên dưới. -->
  <script src="./vietqr.js"></script>
  <script>
  (() => {
    const root = document.getElementById('vietqr-widget');
    if (!root) return;
    const amountInput = root.querySelector('#vqr-custom-amount');
    const image = root.querySelector('#vqr-image');
    const error = root.querySelector('#vqr-error');
    const hint = root.querySelector('#vqr-hint');
    const buttons = [...root.querySelectorAll('[data-vqr-amount]')];

    // Thay bằng BIN 6 chữ số và số tài khoản nhận tiền thật.
    const BANK_BIN = '970422';
    const ACCOUNT_NUMBER = '10260220090';
    const PURPOSE = '';

    /* ----- Sao chép + mở ứng dụng ngân hàng / ví ----- */
    const copyText = async value => {
      try { await navigator.clipboard.writeText(value); return true; }
      catch (_) {
        try {
          const t = document.createElement('textarea');
          t.value = value; t.setAttribute('readonly', '');
          t.style.position = 'fixed'; t.style.opacity = '0';
          document.body.appendChild(t); t.select();
          const ok = document.execCommand('copy'); t.remove();
          return ok;
        } catch (_) { return false; }
      }
    };

    root.querySelectorAll('.copy-btn').forEach(btn => {
      const label = btn.textContent;
      let timer = 0;
      btn.addEventListener('click', async () => {
        const ok = await copyText(btn.dataset.copy);
        btn.textContent = ok ? 'Đã sao chép' : 'Chưa sao chép được';
        btn.classList.toggle('is-done', ok);
        clearTimeout(timer);
        timer = setTimeout(() => { btn.textContent = label; btn.classList.remove('is-done'); }, 1600);
      });
    });

    let hintTimer = 0;
    root.querySelectorAll('[data-open-wallet]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const ok = await copyText(btn.dataset.copy);
        const name = btn.dataset.walletLabel;
        hint.textContent = ok
          ? `Đã sao chép. Nếu ${name} không tự mở, hãy mở ứng dụng và dán vào.`
          : `Đang mở ${name}…`;
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => { hint.textContent = ''; }, 5000);
        window.location.href = btn.dataset.deeplink;
      });
    });

    /* ----- Tạo mã QR ----- */
    if (!window.VietQR || typeof window.VietQR.render !== 'function') {
      error.textContent = 'Không tải được vietqr.js. Kiểm tra đường dẫn ./vietqr.js và chắc chắn file được tải lên website.';
      return;
    }

    function updateQR() {
      const amount = amountInput.value.trim().replace(/[,.\s]/g, '');
      buttons.forEach(button => button.setAttribute('aria-pressed', button.dataset.vqrAmount === amount ? 'true' : 'false'));
      try {
        const result = window.VietQR.render({ bankBin: BANK_BIN, accountNumber: ACCOUNT_NUMBER, amount, purpose: PURPOSE }, image, { size: 512 });
        image.hidden = false;
        error.textContent = '';
        root.dataset.vietqrPayload = result.payload;
      } catch (e) {
        image.hidden = true;
        error.textContent = 'Không tạo được QR: ' + (e && e.message ? e.message : String(e));
      }
    }

    buttons.forEach(button => button.addEventListener('click', () => { amountInput.value = button.dataset.vqrAmount; updateQR(); }));
    amountInput.addEventListener('input', updateQR);
    amountInput.value = '';
    updateQR();
  })();
  </script>
